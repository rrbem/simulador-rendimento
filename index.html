<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Renda Detalhado - RRB</title>
    <style>
        :root {
            --primary-color: #2F5597;
            --accent-color: #D9E1F2;
            --text-color: #333;
            --bg-color: #f4f7f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: var(--accent-color);
            padding: 20px;
            border-radius: 8px;
            align-items: start;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            min-height: 2.8em;
            display: flex;
            align-items: flex-end;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }

        .taxa-info {
            font-size: 0.8em;
            color: #666;
            margin-top: 3px;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-calc {
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
        }

        .btn-calc:hover {
            background-color: #1e3a6d;
        }

        .btn-export {
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }

        .btn-export:hover {
            background-color: #229954;
        }

        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            border: 2px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
        }

        .summary-item {
            padding: 10px;
            text-align: center;
        }

        .summary-item span {
            display: block;
            font-weight: bold;
            font-size: 1.2em;
            color: var(--primary-color);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        @media (max-width: 768px) {
            .summary-box {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .summary-box {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <script>
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	
</head>
<body>

<div class="container">
    <h1>Simulador de Renda Detalhado - RRB</h1>
    
    <div class="grid-inputs">
        <div class="input-group">
            <label>Valor Inicial (R$)</label>
            <input type="text" id="valorInicial" placeholder="0,00" data-type="moeda" value="1.000,00">
        </div>
        <div class="input-group">
            <label>Aporte Mensal (R$)</label>
            <input type="text" id="aporteMensal" placeholder="0,00" data-type="moeda" value="100,00">
        </div>
        <div class="input-group">
            <label>Retirada Mensal (R$)</label>
            <input type="text" id="retiradaMensal" placeholder="0,00" data-type="moeda" value="0,00">
        </div>
        <div class="input-group">
            <label>Taxa de Juros Anual (%)</label>
            <input type="text" id="taxaAnual" placeholder="0,00%" data-type="percentual">
            <div class="taxa-info" id="taxaInfo">Buscando taxa do governo...</div>
        </div>
        <div class="input-group">
            <label>Período (Meses)</label>
            <input type="text" id="periodoMeses" placeholder="1" data-type="numero" value="12">
        </div>
        <div class="input-group">
            <label>Alíquota de IR (% ou "0" para Regressiva)</label>
            <input type="text" id="aliquotaIR" placeholder="22,50%" data-type="percentual" value="0,00">
        </div>
    </div>

    <div class="buttons-group">
        <button class="btn-calc" onclick="calcular()">Calcular Resultados</button>
        <button class="btn-export" onclick="exportarExcel()">📊 Exportar Excel</button>
    </div>

    <div class="summary-box" id="resumo">
        <div class="summary-item">Total Investido<span id="resTotalInvestido">R$ 0,00</span></div>
        <div class="summary-item">Montante Bruto<span id="resMontanteBruto">R$ 0,00</span></div>
        <div class="summary-item">Rendimento Bruto<span id="resRendimentoBruto">R$ 0,00</span></div>
        <div class="summary-item">Imposto de Renda<span id="resIR">R$ 0,00</span></div>
        <div class="summary-item">Rendimento Líquido<span id="resRendimentoLiquido">R$ 0,00</span></div>
        <div class="summary-item">Montante Líquido<span id="resMontanteLiquido">R$ 0,00</span></div>
    </div>

    <div class="chart-container">
        <canvas id="graficoEvolucao"></canvas>
    </div>

    <div class="table-container">
        <table id="tabelaEvolucao">
            <thead>
                <tr>
                    <th>Mês</th>
                    <th>Aporte</th>
                    <th>Retirada</th>
                    <th>Juros (Bruto)</th>
                    <th>Juros (Líquido)</th>
                    <th>Total Acumulado</th>
                    <th>Total Líquido</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<script>
    let meuGrafico = null;

    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function obterValorNumerico(valor) {
        return parseFloat(valor.replace(/[^\d,-]/g, '').replace(',', '.')) || 0;
    }

    function formatarMoedaInput(valor) {
        let num = valor.replace(/[^\d]/g, '');
        if (!num) return '';
        num = (parseInt(num) / 100).toFixed(2);
        return num.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatarPercentualInput(valor) {
        let num = valor.replace(/[^\d]/g, '');
        if (!num) return '';
        // Permite até 4 dígitos (ex: 2250 -> 22,50)
        num = num.slice(0, 4);
        if (num.length <= 1) return num;
        if (num.length === 2) return num;
        let inteiros = num.slice(0, -2);
        let decimais = num.slice(-2);
        return inteiros + ',' + decimais;
    }

    function formatarNumeroInput(valor) {
        return valor.replace(/[^\d]/g, '').slice(0, 3);
    }

    function calcularAliquotaRegressiva(meses) {
        if (meses <= 6) return 22.5;
        if (meses <= 12) return 20.0;
        if (meses <= 24) return 17.5;
        return 15.0;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const campos = document.querySelectorAll('input[data-type]');
        campos.forEach(campo => {
            campo.addEventListener('input', function() {
                const tipo = this.getAttribute('data-type');
                let valor = this.value;
                if (tipo === 'moeda') {
                    this.value = formatarMoedaInput(valor);
                } else if (tipo === 'percentual') {
                    this.value = formatarPercentualInput(valor);
                } else if (tipo === 'numero') {
                    this.value = formatarNumeroInput(valor);
                }
                calcular();
            });
        });
        carregarTaxaDoGoverno();
    });

    async function carregarTaxaDoGoverno() {
        try {
            const response = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json');
            const data = await response.json();
            
            if (data && data[0]) {
                const taxaSelic = parseFloat(data[0].valor);
                window.taxaSelicAtual = taxaSelic;
                const taxaCDI = taxaSelic - 0.1;
                
                document.getElementById('taxaAnual').value = taxaCDI.toFixed(2).replace('.', ',');
                document.getElementById('taxaInfo').textContent = `SELIC: ${taxaSelic.toFixed(2).replace('.', ',')}% a.a. | CDI: ${taxaCDI.toFixed(2).replace('.', ',')}% a.a.`;
                calcular();
            }
        } catch (error) {
            const taxaPadrao = 14.40;
            window.taxaSelicAtual = taxaPadrao;
            document.getElementById('taxaAnual').value = taxaPadrao.toFixed(2).replace('.', ',');
            document.getElementById('taxaInfo').textContent = `Taxa padrão CDI: ${taxaPadrao.toFixed(2).replace('.', ',')}% a.a. (Erro ao buscar taxa do governo)`;
            calcular();
        }
    }

    function calcular() {
        const vInicial = obterValorNumerico(document.getElementById('valorInicial').value) || 0;
        const aporte = obterValorNumerico(document.getElementById('aporteMensal').value) || 0;
        const retirada = obterValorNumerico(document.getElementById('retiradaMensal').value) || 0;
        const taxaAnual = obterValorNumerico(document.getElementById('taxaAnual').value) || 0;
        const mesesRaw = parseInt(document.getElementById('periodoMeses').value.replace(/\D/g, '')) || 0;
        const meses = Math.min(mesesRaw, 480); // Limite de 40 anos
        const aliquota = obterValorNumerico(document.getElementById('aliquotaIR').value) || 0;
        
        const usarRegressiva = aliquota === 0;
        const taxaMensal = Math.pow(1 + (taxaAnual / 100), 1/12) - 1;

        // Cálculo da Taxa da Poupança (Regra: 0.5% se Selic > 8.5, senão 70% da Selic)
        const selicRef = window.taxaSelicAtual || (taxaAnual + 0.1);
        const taxaPoupancaMensal = selicRef > 8.5 ? 0.005 : (Math.pow(1 + (selicRef * 0.7 / 100), 1/12) - 1);

        let saldoBruto = vInicial;
        let saldoPoupanca = vInicial;
        let totalInvestidoAcumulado = vInicial;
        let lastSaldoLiquido = vInicial;
        let htmlTabela = "";
        let dadosBrutos = [saldoBruto];
        let dadosLiquidos = [lastSaldoLiquido];
        let dadosPoupanca = [saldoPoupanca];
        let labels = ["Início"];
        
        for (let i = 1; i <= meses; i++) {
            let baseCalculo = saldoBruto + aporte - retirada;
            let basePoupanca = saldoPoupanca + aporte - retirada;
            totalInvestidoAcumulado += (aporte - retirada);
            
            let jurosMesBruto = baseCalculo * taxaMensal;
            saldoBruto = baseCalculo + jurosMesBruto;

            // Cálculo correto do Leão: Alíquota sobre o lucro acumulado total até o mês i
            const aliqAtual = usarRegressiva ? calcularAliquotaRegressiva(i) : aliquota;
            const lucroAcumulado = Math.max(0, saldoBruto - totalInvestidoAcumulado);
            const impostoTeorico = lucroAcumulado * (aliqAtual / 100);
            const saldoLiquido = saldoBruto - impostoTeorico;
            
            // Juros líquido é a variação do saldo líquido descontando aportes/retiradas
            const jurosMesLiquido = saldoLiquido - lastSaldoLiquido - (aporte - retirada);

            // Evolução Poupança (Isenta de IR)
            saldoPoupanca = basePoupanca * (1 + taxaPoupancaMensal);

            htmlTabela += `<tr>\n                <td>${i}</td>\n                <td>${formatarMoeda(aporte)}</td>\n                <td>${formatarMoeda(retirada)}</td>\n                <td>${formatarMoeda(jurosMesBruto)}</td>\n                <td>${formatarMoeda(jurosMesLiquido)}</td>\n                <td>${formatarMoeda(saldoBruto)}</td>\n                <td>${formatarMoeda(saldoLiquido)}</td>\n            </tr>`;
            
            dadosBrutos.push(saldoBruto);
            dadosLiquidos.push(saldoLiquido);
            dadosPoupanca.push(saldoPoupanca);
            labels.push(`Mês ${i}`);
            lastSaldoLiquido = saldoLiquido;
        }

        document.querySelector("#tabelaEvolucao tbody").innerHTML = htmlTabela;

        const totalInvestido = totalInvestidoAcumulado;
        const montanteBruto = saldoBruto;
        const rendimentoBruto = Math.max(0, montanteBruto - totalInvestido);
        const aliqFinal = usarRegressiva ? calcularAliquotaRegressiva(meses) : aliquota;
        const imposto = rendimentoBruto * (aliqFinal / 100);
        const rendimentoLiquido = rendimentoBruto - imposto;
        const montanteLiquido = montanteBruto - imposto;

        document.getElementById('resTotalInvestido').innerText = formatarMoeda(totalInvestido);
        document.getElementById('resMontanteBruto').innerText = formatarMoeda(montanteBruto);
        document.getElementById('resRendimentoBruto').innerText = formatarMoeda(rendimentoBruto);
        document.getElementById('resIR').innerText = formatarMoeda(imposto);
        document.getElementById('resRendimentoLiquido').innerText = formatarMoeda(rendimentoLiquido);
        document.getElementById('resMontanteLiquido').innerText = formatarMoeda(montanteLiquido);

        renderizarGrafico(labels, dadosBrutos, dadosLiquidos, dadosPoupanca);
    }

    function renderizarGrafico(labels, brutos, liquidos, poupanca) {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if (meuGrafico) meuGrafico.destroy();

        meuGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Montante Bruto',
                        data: brutos,
                        borderColor: '#2F5597',
                        backgroundColor: 'rgba(47, 85, 151, 0.1)',
                        fill: true
                    },
                    {
                        label: 'Montante Líquido',
                        data: liquidos,
                        borderColor: '#27ae60',
                        backgroundColor: 'transparent',
                        borderDash: [5, 5]
                    },
                    {
                        label: 'Poupança (Isenta)',
                        data: poupanca,
                        borderColor: '#f1c40f',
                        backgroundColor: 'transparent',
                        borderWidth: 2
                    }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function exportarExcel() {
        const vInicial = obterValorNumerico(document.getElementById('valorInicial').value) || 0;
        const aporte = obterValorNumerico(document.getElementById('aporteMensal').value) || 0;
        const retirada = obterValorNumerico(document.getElementById('retiradaMensal').value) || 0;
        const taxaAnual = obterValorNumerico(document.getElementById('taxaAnual').value) || 0;
        const meses = parseInt(document.getElementById('periodoMeses').value.replace(/\D/g, '')) || 0;
        const aliquota = obterValorNumerico(document.getElementById('aliquotaIR').value) || 0;

        let csv = 'SIMULADOR DE RENDA DETALHADO\n';
        csv += 'Data: ' + new Date().toLocaleDateString('pt-BR') + '\n\n';
        
        csv += 'PARÂMETROS DA SIMULAÇÃO\n';
        csv += 'Valor Inicial (R$),' + vInicial.toFixed(2) + '\n';
        csv += 'Aporte Mensal (R$),' + aporte.toFixed(2) + '\n';
        csv += 'Retirada Mensal (R$),' + retirada.toFixed(2) + '\n';
        csv += 'Taxa de Juros Anual (%),' + taxaAnual.toFixed(2) + '\n';
        csv += 'Período (Meses),' + meses + '\n';
        csv += 'Alíquota de IR (%),' + aliquota.toFixed(2) + '\n\n';

        csv += 'RESUMO FINAL\n';
        csv += 'Total Investido,' + document.getElementById('resTotalInvestido').innerText.replace('R$ ', '').replace('.', '').replace(',', '.') + '\n';
        csv += 'Montante Bruto,' + document.getElementById('resMontanteBruto').innerText.replace('R$ ', '').replace('.', '').replace(',', '.') + '\n';
        csv += 'Rendimento Bruto,' + document.getElementById('resRendimentoBruto').innerText.replace('R$ ', '').replace('.', '').replace(',', '.') + '\n';
        csv += 'Imposto de Renda,' + document.getElementById('resIR').innerText.replace('R$ ', '').replace('.', '').replace(',', '.') + '\n';
        csv += 'Rendimento Líquido,' + document.getElementById('resRendimentoLiquido').innerText.replace('R$ ', '').replace('.', '').replace(',', '.') + '\n';
        csv += 'Montante Líquido,' + document.getElementById('resMontanteLiquido').innerText.replace('R$ ', '').replace('.', '').replace(',', '.') + '\n\n';

        csv += 'EVOLUÇÃO MÊS A MÊS\n';
        csv += 'Mês,Aporte,Retirada,Juros (Bruto),Juros (Líquido),Total Acumulado,Total Líquido\n';
        
        const tabela = document.querySelector('#tabelaEvolucao tbody');
        for (let row of tabela.rows) {
            let linha = '';
            for (let cell of row.cells) {
                let valor = cell.innerText.replace('R$ ', '').replace(/\./g, '').replace(',', '.');
                linha += valor + ',';
            }
            csv += linha.slice(0, -1) + '\n';
        }

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'simulador_renda_' + new Date().toLocaleDateString('pt-BR').replace(/\//g, '-') + '.csv';
        a.click();
        window.URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
