<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Renda Detalhado</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6HQMKR4FHB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6HQMKR4FHB');

    <style>
        :root {
            --primary-color: #2F5597;
            --accent-color: #D9E1F2;
            --text-color: #333;
            --bg-color: #f4f7f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .header-container img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.8em;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: var(--accent-color);
            padding: 20px;
            border-radius: 8px;
            align-items: start;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            min-height: 2.8em;
            display: flex;
            align-items: flex-end;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }

        .taxa-info {
            font-size: 0.8em;
            color: #666;
            margin-top: 3px;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-calc {
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
        }

        .btn-calc:hover {
            background-color: #1e3a6d;
        }

        .btn-reset {
            padding: 12px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
        }

        .btn-reset:hover {
            background-color: #d35400;
        }

        .btn-export {
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }

        .btn-export:hover {
            background-color: #229954;
        }

        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            border: 2px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
        }

        .summary-item {
            padding: 10px;
            text-align: center;
        }

        .summary-item span {
            display: block;
            font-weight: bold;
            font-size: 1.2em;
            color: var(--primary-color);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .chart-container {
            height: 400px;
            margin: 30px 0;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e0e6ed;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        @media (max-width: 768px) {
            .summary-box {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .summary-box {
                grid-template-columns: 1fr;
            }
        }

        /* Estilos para as Abas */
        .tabs-nav {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            overflow-x: auto; /* Permite rolar as abas se a tela for muito pequena */
            white-space: nowrap;
        }
        .tab-btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: bold;
            color: #666;
            font-size: 0.9em;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Seletores de Período no Gráfico */
        .periodo-selector {
            display: flex;
            gap: 5px;
        }
        .btn-periodo {
            padding: 4px 8px;
            font-size: 0.75em;
            border: 1px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-periodo.active {
            background: var(--primary-color);
            color: white;
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <script>
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="info.js" defer></script>
	
</head>
<body>

<div class="container">
    <header class="header-container">
        <img src="icon-192.png" alt="Ícone Financeiro">
        <h1 id="main-title">Simulador de Renda Detalhado</h1>
    </header>

    <nav class="tabs-nav">
        <button class="tab-btn active" onclick="alternarAba(event, 'aba-simulador')">Simulador</button>
        <button class="tab-btn" onclick="alternarAba(event, 'aba-info')">Informações e Taxas</button>
    </nav>
    
    <div id="aba-simulador" class="tab-content active">
        <div class="grid-inputs">
            <div class="input-group">
                <label>Valor Inicial (R$)</label>
                <input type="text" id="valorInicial" placeholder="0,00" data-type="moeda" value="1.000,00">
            </div>
            <div class="input-group">
                <label>Aporte Mensal (R$)</label>
                <input type="text" id="aporteMensal" placeholder="0,00" data-type="moeda" value="0,00">
            </div>
            <div class="input-group">
                <label>Retirada Mensal (R$)</label>
                <input type="text" id="retiradaMensal" placeholder="0,00" data-type="moeda" value="0,00">
            </div>
            <div class="input-group">
                <label>Taxa de Juros Anual (%)</label>
                <input type="text" id="taxaAnual" placeholder="0,00%" data-type="percentual">
                <div class="taxa-info" id="taxaInfo">Buscando taxa do governo...</div>
            </div>
            <div class="input-group">
                <label>Período (Meses)</label>
                <input type="text" id="periodoMeses" placeholder="1" data-type="numero" value="1">
            </div>
            <div class="input-group">
                <label>Alíquota de IR (% ou "0" para Regressiva)</label>
                <input type="text" id="aliquotaIR" placeholder="22,50%" data-type="percentual" value="0,00">
            </div>
        </div>

        <div class="buttons-group">
            <button class="btn-calc" onclick="calcular()">Calcular Resultados</button>
            <button class="btn-reset" onclick="resetarCampos()">Limpar Campos</button>
            <button class="btn-export" onclick="exportarExcel()">📊 Exportar Excel</button>
        </div>

        <div class="summary-box" id="resumo">
            <div class="summary-item">Total Investido<span id="resTotalInvestido">R$ 0,00</span></div>
            <div class="summary-item">Montante Bruto<span id="resMontanteBruto">R$ 0,00</span></div>
            <div class="summary-item">Rendimento Bruto<span id="resRendimentoBruto">R$ 0,00</span></div>
            <div class="summary-item">Imposto de Renda<span id="resIR">R$ 0,00</span></div>
            <div class="summary-item">Rendimento Líquido<span id="resRendimentoLiquido">R$ 0,00</span></div>
            <div class="summary-item">Montante Líquido<span id="resMontanteLiquido">R$ 0,00</span></div>
        </div>

        <div class="chart-container">
            <canvas id="graficoEvolucao"></canvas>
        </div>

        <div class="table-container">
            <table id="tabelaEvolucao">
                <thead>
                    <tr>
                        <th>Mês</th>
                        <th>Aporte</th>
                        <th>Retirada</th>
                        <th>Juros (Bruto)</th>
                        <th>Juros (Líquido)</th>
                        <th>Total Acumulado</th>
                        <th>Total Líquido</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="aba-info" class="tab-content"></div>
</div>

<script>
    let meuGrafico = null;

    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function alternarAba(evt, nomeAba) {
        const contents = document.getElementsByClassName("tab-content");
        for (let content of contents) content.classList.remove("active");

        const buttons = document.getElementsByClassName("tab-btn");
        for (let btn of buttons) btn.classList.remove("active");

        const targetAba = document.getElementById(nomeAba);
        
        // Lógica de carregamento sob demanda para abas externas
        if (nomeAba === 'aba-info') {
            if (targetAba.innerHTML.trim() === "") {
            try {
                const response = await fetch('info.html');
                    if (!response.ok) throw new Error('Falha ao carregar arquivo');
                const html = await response.text();
                targetAba.innerHTML = html;
            } catch (error) {
                    targetAba.innerHTML = "<p>Erro ao carregar as informações. Use um servidor local (Live Server).</p>";
                    return;
                }
            }
            
            // Dispara um evento customizado informando que a aba está pronta/ativa
            // Isso permite que o info.js execute sem o index.html chamá-lo diretamente
            targetAba.dispatchEvent(new CustomEvent('abaAtivada', { bubbles: true }));
        }

        targetAba.classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    function obterValorNumerico(valor) {
        if (!valor) return 0;
        // Remove pontos de milhar, substitui vírgula por ponto
        const limpo = valor.replace(/\./g, '').replace(',', '.');
        const num = parseFloat(limpo);
        return isNaN(num) ? 0 : num;
    }

    function formatarMoedaInput(valor) {
        let num = valor.replace(/[^\d]/g, '');
        if (!num) return '';
        num = (parseInt(num) / 100).toFixed(2);
        return num.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatarPercentualInput(valor) {
        let num = valor.replace(/[^\d]/g, '');
        if (!num) return '';
        // Permite até 4 dígitos (ex: 2250 -> 22,50)
        num = num.slice(0, 4);
        if (num.length <= 1) return num;
        if (num.length === 2) return num; // Caso o usuário digite apenas dois números
        let inteiros = num.slice(0, -2);
        let decimais = num.slice(-2);
        return inteiros + ',' + decimais;
    }

    function formatarNumeroInput(valor) {
        return valor.replace(/[^\d]/g, '').slice(0, 3);
    }

    function resetarCampos() {
        if (confirm('Deseja realmente limpar todos os campos e voltar aos valores originais?')) {
            localStorage.removeItem('simulador_dados');
            
            document.getElementById('valorInicial').value = '1.000,00';
            document.getElementById('aporteMensal').value = '0,00';
            document.getElementById('retiradaMensal').value = '0,00';
            document.getElementById('taxaAnual').value = ''; 
            document.getElementById('periodoMeses').value = '1';
            document.getElementById('aliquotaIR').value = '0,00';
            
            carregarTaxaDoGoverno();
        }
    }

    function salvarDadosLocal() {
        const campos = ['valorInicial', 'aporteMensal', 'retiradaMensal', 'taxaAnual', 'periodoMeses', 'aliquotaIR'];
        const dados = {};
        campos.forEach(id => {
            dados[id] = document.getElementById(id).value;
        });
        localStorage.setItem('simulador_dados', JSON.stringify(dados));
    }

    function carregarDadosLocal() {
        const dadosStr = localStorage.getItem('simulador_dados');
        if (dadosStr) {
            const dados = JSON.parse(dadosStr);
            Object.keys(dados).forEach(id => {
                const el = document.getElementById(id);
                if (el && dados[id] !== undefined) {
                    el.value = dados[id];
                }
            });
        }
    }

    function calcularAliquotaRegressiva(meses) {
        if (meses <= 6) return 22.5;
        if (meses <= 12) return 20.0;
        if (meses <= 24) return 17.5;
        return 15.0;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const hoje = new Date().toLocaleDateString('pt-BR');
        const novoTitulo = `Simulador de Renda Detalhado - ${hoje}`;
        document.title = novoTitulo;
        document.getElementById('main-title').innerText = novoTitulo;

        carregarDadosLocal();

        const campos = document.querySelectorAll('input[data-type]');
        campos.forEach(campo => {
            campo.addEventListener('input', function() {
                const tipo = this.getAttribute('data-type');
                let valor = this.value;
                if (tipo === 'moeda') {
                    this.value = formatarMoedaInput(valor);
                } else if (tipo === 'percentual') {
                    this.value = formatarPercentualInput(valor);
                } else if (tipo === 'numero') {
                    this.value = formatarNumeroInput(valor);
                }
                salvarDadosLocal();
                calcular();
            });
        });
        carregarTaxaDoGoverno();
    });

    async function carregarTaxaDoGoverno() {
        try {
            const response = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json');
            const data = await response.json();
            
            if (data && data[0]) {
                const taxaSelic = parseFloat(data[0].valor);
                window.taxaSelicAtual = taxaSelic;
                const taxaCDI = taxaSelic - 0.1;
                
                if (!document.getElementById('taxaAnual').value) {
                    document.getElementById('taxaAnual').value = taxaCDI.toFixed(2).replace('.', ',');
                }
                document.getElementById('taxaInfo').textContent = `SELIC: ${taxaSelic.toFixed(2).replace('.', ',')}% a.a. | CDI: ${taxaCDI.toFixed(2).replace('.', ',')}% a.a.`;
                calcular();
            }
        } catch (error) {
            const taxaPadrao = 14.40;
            window.taxaSelicAtual = taxaPadrao;
            if (!document.getElementById('taxaAnual').value) {
                document.getElementById('taxaAnual').value = taxaPadrao.toFixed(2).replace('.', ',');
            }
            document.getElementById('taxaInfo').textContent = `Taxa padrão CDI: ${taxaPadrao.toFixed(2).replace('.', ',')}% a.a. (Erro ao buscar taxa do governo)`;
            calcular();
        }
    }

    function calcular() {
        const vInicial = obterValorNumerico(document.getElementById('valorInicial').value) || 0;
        const aporte = obterValorNumerico(document.getElementById('aporteMensal').value) || 0;
        const retirada = obterValorNumerico(document.getElementById('retiradaMensal').value) || 0;
        const taxaAnual = obterValorNumerico(document.getElementById('taxaAnual').value) || 0;
        const mesesRaw = parseInt(document.getElementById('periodoMeses').value.replace(/\D/g, '')) || 0;
        const meses = Math.min(mesesRaw, 480); // Limite de 40 anos
        const aliquota = obterValorNumerico(document.getElementById('aliquotaIR').value) || 0;
        
        const usarRegressiva = aliquota === 0;
        const taxaMensal = Math.pow(1 + (taxaAnual / 100), 1/12) - 1;

        // Cálculo da Taxa da Poupança (Regra: 0.5% se Selic > 8.5, senão 70% da Selic)
        const selicRef = window.taxaSelicAtual || (taxaAnual + 0.1);
        const taxaPoupancaMensal = selicRef > 8.5 ? 0.005 : (Math.pow(1 + (selicRef * 0.7 / 100), 1/12) - 1);

        let saldoBruto = vInicial;
        let saldoPoupanca = vInicial;
        let totalInvestidoAcumulado = vInicial;
        let lastSaldoLiquido = vInicial;
        let htmlTabela = "";
        let dadosBrutos = [saldoBruto];
        let dadosLiquidos = [lastSaldoLiquido];
        let dadosPoupanca = [saldoPoupanca];
        let labels = ["Início"];
        
        for (let i = 1; i <= meses; i++) {
            // Validação: Não permite que a retirada exceda o saldo disponível
            const retiradaReal = Math.min(retirada, saldoBruto + aporte);
            const retiradaPoupancaReal = Math.min(retirada, saldoPoupanca + aporte);

            let baseCalculo = saldoBruto + aporte - retiradaReal;
            let basePoupanca = saldoPoupanca + aporte - retiradaPoupancaReal;
            
            totalInvestidoAcumulado += (aporte - retiradaReal);
            
            let jurosMesBruto = baseCalculo * taxaMensal;
            saldoBruto = baseCalculo + jurosMesBruto;

            // Cálculo correto do Leão: Alíquota sobre o lucro acumulado total até o mês i
            const aliqAtual = usarRegressiva ? calcularAliquotaRegressiva(i) : aliquota;
            const lucroAcumulado = Math.max(0, saldoBruto - totalInvestidoAcumulado);
            const impostoTeorico = lucroAcumulado * (aliqAtual / 100);
            const saldoLiquido = saldoBruto - impostoTeorico;
            
            // Juros líquido é a variação do saldo líquido descontando aportes/retiradas
            const jurosMesLiquido = saldoLiquido - lastSaldoLiquido - (aporte - retiradaReal);

            // Evolução Poupança (Isenta de IR)
            saldoPoupanca = basePoupanca * (1 + taxaPoupancaMensal);

            htmlTabela += `<tr>\n                <td>${i}</td>\n                <td>${formatarMoeda(aporte)}</td>\n                <td>${formatarMoeda(retiradaReal)}</td>\n                <td>${formatarMoeda(jurosMesBruto)}</td>\n                <td>${formatarMoeda(jurosMesLiquido)}</td>\n                <td>${formatarMoeda(saldoBruto)}</td>\n                <td>${formatarMoeda(saldoLiquido)}</td>\n            </tr>`;
            
            dadosBrutos.push(saldoBruto);
            dadosLiquidos.push(saldoLiquido);
            dadosPoupanca.push(saldoPoupanca);
            labels.push(`Mês ${i}`);
            lastSaldoLiquido = saldoLiquido;
        }

        document.querySelector("#tabelaEvolucao tbody").innerHTML = htmlTabela;

        const totalInvestido = totalInvestidoAcumulado;
        const montanteBruto = saldoBruto;
        const rendimentoBruto = Math.max(0, montanteBruto - totalInvestido);
        const aliqFinal = usarRegressiva ? calcularAliquotaRegressiva(meses) : aliquota;
        const imposto = rendimentoBruto * (aliqFinal / 100);
        const rendimentoLiquido = rendimentoBruto - imposto;
        const montanteLiquido = montanteBruto - imposto;

        document.getElementById('resTotalInvestido').innerText = formatarMoeda(totalInvestido);
        document.getElementById('resMontanteBruto').innerText = formatarMoeda(montanteBruto);
        document.getElementById('resRendimentoBruto').innerText = formatarMoeda(rendimentoBruto);
        document.getElementById('resIR').innerText = formatarMoeda(imposto);
        document.getElementById('resRendimentoLiquido').innerText = formatarMoeda(rendimentoLiquido);
        document.getElementById('resMontanteLiquido').innerText = formatarMoeda(montanteLiquido);

        renderizarGrafico(labels, dadosBrutos, dadosLiquidos, dadosPoupanca);
    }

    function renderizarGrafico(labels, brutos, liquidos, poupanca) {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if (meuGrafico) meuGrafico.destroy();

        meuGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Montante Bruto',
                        data: brutos,
                        borderColor: '#2F5597',
                        borderWidth: 3,
                        fill: false,
                        tension: 0.4,
                        pointRadius: labels.length > 60 ? 0 : 3,
                        pointHitRadius: 10
                    },
                    {
                        label: 'Montante Líquido',
                        data: liquidos,
                        borderColor: '#10b981',
                        borderWidth: 3,
                        fill: false,
                        tension: 0.4,
                        pointRadius: 0
                    },
                    {
                        label: 'Poupança (Isenta)',
                        data: poupanca,
                        borderColor: '#f59e0b',
                        borderDash: [10, 5],
                        borderWidth: 2,
                        fill: false,
                        tension: 0.4,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                            padding: 20,
                            font: { family: "'Segoe UI', sans-serif", size: 12 }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(255, 255, 255, 0.9)',
                        titleColor: '#333',
                        bodyColor: '#666',
                        borderColor: '#ddd',
                        borderWidth: 1,
                        padding: 12,
                        callbacks: {
                            label: (context) => {
                                let label = context.dataset.label || '';
                                if (label) label += ': ';
                                label += new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(context.parsed.y);
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { autoSkip: true, maxTicksLimit: 12 } },
                    y: { 
                        beginAtZero: false,
                        grace: '5%',
                        grid: { color: 'rgba(0, 0, 0, 0.05)' },
                        ticks: { callback: v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }) }
                    }
                }
            }
        });
    }

    function exportarExcel() {
        const sep = ';'; // Separador ideal para Excel em português (Brasil)
        let csv = '\ufeff'; // Adiciona o BOM para garantir suporte a UTF-8 (acentos e R$) no Excel
        
        csv += 'SIMULADOR DE RENDA DETALHADO\n';
        csv += 'Data: ' + new Date().toLocaleDateString('pt-BR') + '\n\n';
        
        csv += 'PARÂMETROS DA SIMULAÇÃO\n';
        csv += 'Valor Inicial (R$)' + sep + document.getElementById('valorInicial').value + '\n';
        csv += 'Aporte Mensal (R$)' + sep + document.getElementById('aporteMensal').value + '\n';
        csv += 'Retirada Mensal (R$)' + sep + document.getElementById('retiradaMensal').value + '\n';
        csv += 'Taxa de Juros Anual (%)' + sep + document.getElementById('taxaAnual').value + '\n';
        csv += 'Período (Meses)' + sep + document.getElementById('periodoMeses').value + '\n';
        csv += 'Alíquota de IR (%)' + sep + document.getElementById('aliquotaIR').value + '\n\n';

        csv += 'RESUMO FINAL\n';
        csv += 'Total Investido' + sep + document.getElementById('resTotalInvestido').innerText.replace('R$', '').trim() + '\n';
        csv += 'Montante Bruto' + sep + document.getElementById('resMontanteBruto').innerText.replace('R$', '').trim() + '\n';
        csv += 'Rendimento Bruto' + sep + document.getElementById('resRendimentoBruto').innerText.replace('R$', '').trim() + '\n';
        csv += 'Imposto de Renda' + sep + document.getElementById('resIR').innerText.replace('R$', '').trim() + '\n';
        csv += 'Rendimento Líquido' + sep + document.getElementById('resRendimentoLiquido').innerText.replace('R$', '').trim() + '\n';
        csv += 'Montante Líquido' + sep + document.getElementById('resMontanteLiquido').innerText.replace('R$', '').trim() + '\n\n';

        csv += 'EVOLUÇÃO MÊS A MÊS\n';
        csv += ['Mês', 'Aporte', 'Retirada', 'Juros (Bruto)', 'Juros (Líquido)', 'Total Acumulado', 'Total Líquido'].join(sep) + '\n';
        
        const tabela = document.querySelector('#tabelaEvolucao tbody');
        for (let row of tabela.rows) {
            let colunas = [];
            for (let cell of row.cells) {
                // Remove o R$ e mantém a formatação pt-BR (vírgula como decimal) para compatibilidade com Excel
                let valor = cell.innerText.replace('R$', '').trim();
                colunas.push(valor);
            }
            csv += colunas.join(sep) + '\n';
        }

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'simulador_renda_' + new Date().toLocaleDateString('pt-BR').replace(/\//g, '-') + '.csv';
        a.click();
        window.URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
